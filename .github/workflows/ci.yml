name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: Garde-fous statiques
        run: npm run lint
      - name: Contrôles fonctionnels (local)
        run: npm run check
      - name: Contrôles fonctionnels (supabase)
        run: WG_DATA_SOURCE=supabase npm run check
      - name: Tests unitaires Vitest
        run: npm run test:unit
      - name: Build production
        run: npm run build
      - name: Navigateur Chromium
        run: npx playwright install --with-deps chromium
      - name: 15 parcours Playwright
        run: npm run test:e2e
