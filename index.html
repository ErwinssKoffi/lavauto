<!doctype html>
<html lang="fr" class="dark" data-theme="washguard-dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="WashGuard — la gestion complète de votre station de lavage : lavages, caisse, employés, commissions et rapports. En FCFA, en français." />
    <meta property="og:title" content="WashGuard — Gestion de station de lavage" />
    <meta property="og:description" content="WashGuard — la gestion complète de votre station de lavage : lavages, caisse, employés, commissions et rapports. En FCFA, en français." />
    <meta name="theme-color" content="#080f1d" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="WashGuard" />
    <!-- Thème appliqué avant le premier rendu : pas de flash sombre pour les
         utilisateurs qui ont choisi le thème clair. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('washguard.theme');
          var name = localStorage.getItem('washguard.theme.name');
          var light = saved === 'light';
          document.documentElement.classList.toggle('dark', !light);
          document.documentElement.setAttribute(
            'data-theme',
            typeof name === 'string' && /^[a-z0-9-]+$/.test(name) ? name : (light ? 'washguard' : 'washguard-dark'),
          );
        } catch (e) { /* stockage indisponible : thème sombre par défaut */ }
      })();
    </script>
    <title>WashGuard — Gestion de station de lavage</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
