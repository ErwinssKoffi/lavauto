<!doctype html>
<html lang="fr" data-theme="cupcake">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="WashGuard — la gestion complète de votre station de lavage : lavages, caisse, employés, commissions et rapports. En FCFA, en français." />
    <meta property="og:title" content="WashGuard — Gestion de station de lavage" />
    <meta property="og:description" content="WashGuard — la gestion complète de votre station de lavage : lavages, caisse, employés, commissions et rapports. En FCFA, en français." />
    <meta name="theme-color" content="#faf7f5" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="WashGuard" />
    <!-- Thème appliqué avant le premier rendu : aucun flash, et le thème
         choisi par l'utilisateur est respecté dès la première peinture.
         Le thème par défaut du projet est `cupcake` (DEFAULT_THEME). -->
    <script>
      (function () {
        try {
          var name = localStorage.getItem('washguard.theme.name');
          var scheme = localStorage.getItem('washguard.theme');
          var known = typeof name === 'string' && /^[a-z0-9-]+$/.test(name);
          document.documentElement.setAttribute('data-theme', known ? name : 'cupcake');
          // La classe `dark` est conservée pour compatibilité (scrollbars, tiers).
          document.documentElement.classList.toggle('dark', scheme === 'dark');
        } catch (e) { /* stockage indisponible : cupcake par défaut */ }
      })();
    </script>
    <title>WashGuard — Gestion de station de lavage</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
